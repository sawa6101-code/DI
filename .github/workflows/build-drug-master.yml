name: Build internal-use medicine master

on:
  push:
    paths:
      - ".github/workflows/build-drug-master.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract internal-use medicines from official HPDX master
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import urllib.request
          import zipfile
          from pathlib import Path

          url = "https://www.hpdx.or.jp/seikyushiharai/tensuhyo/kihonmasta/kihonmasta_04.files/y_ALL20261112.zip"
          with urllib.request.urlopen(url, timeout=90) as response:
              archive_bytes = response.read()

          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              csv_name = next(name for name in archive.namelist() if name.lower().endswith(".csv"))
              with archive.open(csv_name) as raw:
                  text = io.TextIOWrapper(raw, encoding="cp932", newline="")
                  rows = list(csv.reader(text))

          if not rows or any(len(row) < 42 for row in rows):
              raise RuntimeError("Unexpected HPDX medicine master layout; expected fields through item 42.")

          # HPDX 2026 layout:
          # 3=drug code, 5=name, 28=dosage category (1=internal),
          # 31=discontinuation date, 32=YJ code, 35=basic name,
          # 37=generic-name code, 38=standard generic-name description.
          oral = []
          for row in rows:
              if row[1] != "Y" or row[27] != "1":
                  continue
              oral.append({
                  "code": row[2],
                  "name": row[4],
                  "unit": row[9],
                  "price": row[11],
                  "officialName": row[34],
                  "discontinuedDate": row[30],
                  "yjCode": row[31],
                  "genericCode": row[36],
                  "genericName": row[37],
                  "genericAdditiveClass": row[38] if len(row) > 38 else "",
                  "formCode": row[27],
                  "masterDate": "2026-11-12",
              })

          if not oral:
              raise RuntimeError("No internal-use medicines found")

          output = Path("jikaseizai-hantei/drug_master.json")
          output.write_text(json.dumps(oral, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          print(f"Extracted {len(oral)} internal-use records from {len(rows)} records.")
          print(f"Rows with generic-name description: {sum(bool(x['genericName']) for x in oral)}")
          print(f"Wrote {output} ({output.stat().st_size} bytes).")
          PY

      - name: Commit updated master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jikaseizai-hantei/drug_master.json
          if git diff --cached --quiet; then
            echo "No master changes."
          else
            git commit -m "Build internal-use medicine master for market-form matching"
            git push
          fi